<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabbit Hunter - SQL 脚本复制工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 500px;
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        button.secondary {
            background: #2196F3;
        }
        button.secondary:hover {
            background: #0b7dda;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .status.success {
            background: #4CAF50;
            color: white;
            display: block;
        }
        .status.error {
            background: #f44336;
            color: white;
            display: block;
        }
        .instructions {
            background: #333;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }
        .instructions ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        .instructions li {
            margin: 8px 0;
        }
        .link {
            color: #4CAF50;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦅 Rabbit Hunter - SQL 脚本执行工具</h1>
        <p class="subtitle">复制 SQL 脚本到 Supabase Dashboard 执行</p>
        
        <div class="instructions">
            <h3>📋 执行步骤：</h3>
            <ol>
                <li>点击下面的 <strong>"复制 SQL 到剪贴板"</strong> 按钮</li>
                <li>打开 <a href="https://supabase.com/dashboard/project/qpufonakogxhiauojbcd" target="_blank" class="link">Supabase Dashboard</a></li>
                <li>进入 <strong>SQL Editor</strong>（左侧菜单）</li>
                <li>点击 <strong>"New Query"</strong></li>
                <li>粘贴 SQL（Ctrl+V）</li>
                <li>点击 <strong>"Run"</strong> 按钮执行</li>
            </ol>
        </div>
        
        <textarea id="sqlContent" readonly></textarea>
        
        <div class="buttons">
            <button onclick="copyToClipboard()">📋 复制 SQL 到剪贴板</button>
            <button class="secondary" onclick="openSupabase()">🚀 打开 Supabase Dashboard</button>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // 加载 SQL 内容（这里需要从文件读取，但由于浏览器安全限制，我们直接嵌入）
        const sqlContent = `-- ============================================
-- Rabbit Hunter 2.0 数据库 Schema
-- 执行说明：在 Supabase SQL Editor 中运行此脚本
-- ============================================

-- ============================================
-- 1. 创建枚举类型
-- ============================================

-- 市场状态类型枚举（防止拼写错误）
CREATE TYPE market_regime_type AS ENUM (
  'NORMAL', 
  'TREND_UP', 
  'TREND_DOWN', 
  'SQUEEZE', 
  'MANIPULATED', 
  'LOW_LIQ',
  'CROWDED_LONG'
);

-- ============================================
-- 2. AI 训练数据表 (V2)
-- ============================================

CREATE TABLE IF NOT EXISTS ai_training_data_v2 (
  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT TIMEZONE('utc'::text, NOW()) NOT NULL,
  
  -- 基础信息
  symbol TEXT NOT NULL,
  price NUMERIC,
  
  -- 🏆 核心升级：庄家行为矩阵特征 (Whale Matrix)
  funding_rate NUMERIC,          -- 资金费率
  long_short_ratio NUMERIC,      -- 多空账户比 (Sentiment)
  oi_value NUMERIC,              -- 持仓量 (Open Interest)
  oi_change_1h NUMERIC,          -- 持仓量变化率
  price_change_1h NUMERIC,       -- 价格变化率
  is_oi_divergence BOOLEAN,      -- 是否发生量价背离 (True = 庄家搞鬼)
  
  -- 🏆 核心升级：市场状态定性 (The "Label")
  market_regime market_regime_type, -- 当前属于什么市场状态
  risk_reasons TEXT[],              -- 风控原因数组，例如 ['OI_DIV', 'NEG_FUNDING']
  
  -- 决策记录
  is_trade_allowed BOOLEAN,      -- 风控是否放行
  technical_signal TEXT,         -- 技术指标原本想做什么 ('LONG', 'SHORT')
  
  -- 结果验证 (用于后续回测填充)
  profit_1h NUMERIC              -- 1小时后的盈亏
);

-- 创建索引以提高查询性能
CREATE INDEX IF NOT EXISTS idx_ai_training_data_v2_symbol ON ai_training_data_v2(symbol);
CREATE INDEX IF NOT EXISTS idx_ai_training_data_v2_created_at ON ai_training_data_v2(created_at);
CREATE INDEX IF NOT EXISTS idx_ai_training_data_v2_market_regime ON ai_training_data_v2(market_regime);
CREATE INDEX IF NOT EXISTS idx_ai_training_data_v2_is_trade_allowed ON ai_training_data_v2(is_trade_allowed);

-- ============================================
-- 3. 系统配置表
-- ============================================

CREATE TABLE IF NOT EXISTS system_settings (
  key TEXT PRIMARY KEY,        -- 例如 'kill_switch', 'max_position_size'
  value TEXT,                  -- 例如 'ON', 'OFF', '100'
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

-- 插入默认配置
INSERT INTO system_settings (key, value) VALUES
  ('kill_switch', 'OFF'),
  ('max_position_size', '100'),
  ('max_negative_funding_rate', '-0.0005'),
  ('max_risk_score', '80'),
  ('oi_divergence_threshold', '-0.05'),
  ('long_short_ratio_threshold', '2.5')
ON CONFLICT (key) DO NOTHING;

-- ============================================
-- 4. 实时监控快照表
-- ============================================

CREATE TABLE IF NOT EXISTS market_snapshot (
  symbol TEXT PRIMARY KEY,     -- TRB/USDT
  price NUMERIC,
  funding_rate NUMERIC,
  risk_score INT,              -- 0-100
  risk_level TEXT,             -- 'SAFE', 'WARNING', 'DANGER'
  regime TEXT,                 -- 'SQUEEZE', 'NORMAL', 'MANIPULATED'
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

-- 创建索引
CREATE INDEX IF NOT EXISTS idx_market_snapshot_risk_level ON market_snapshot(risk_level);
CREATE INDEX IF NOT EXISTS idx_market_snapshot_updated_at ON market_snapshot(updated_at);

-- ============================================
-- 5. 决策日志表
-- ============================================

CREATE TABLE IF NOT EXISTS decision_log (
  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
  created_at TIMESTAMPTZ DEFAULT NOW() NOT NULL,
  symbol TEXT NOT NULL,
  action TEXT,                 -- 'BUY', 'SELL', 'REJECT'
  reason TEXT,                 -- 决策原因
  strategy_source TEXT,        -- 来源策略，如 'MACD_Golden_Cross'
  market_regime TEXT,          -- 市场状态
  risk_score INT,
  technical_signal TEXT        -- 技术指标信号
);

-- 创建索引
CREATE INDEX IF NOT EXISTS idx_decision_log_symbol ON decision_log(symbol);
CREATE INDEX IF NOT EXISTS idx_decision_log_created_at ON decision_log(created_at DESC);
CREATE INDEX IF NOT EXISTS idx_decision_log_action ON decision_log(action);

-- ============================================
-- 6. 启用 Realtime（用于前端实时订阅）
-- ============================================

-- 为 market_snapshot 表启用 Realtime
ALTER PUBLICATION supabase_realtime ADD TABLE market_snapshot;

-- 为 decision_log 表启用 Realtime
ALTER PUBLICATION supabase_realtime ADD TABLE decision_log;

-- 为 system_settings 表启用 Realtime
ALTER PUBLICATION supabase_realtime ADD TABLE system_settings;

-- ============================================
-- 7. 创建视图（可选，用于前端查询）
-- ============================================

-- 高危币种视图
CREATE OR REPLACE VIEW high_risk_symbols AS
SELECT 
  symbol,
  price,
  funding_rate,
  risk_score,
  risk_level,
  regime,
  updated_at
FROM market_snapshot
WHERE risk_level = 'DANGER'
ORDER BY risk_score DESC;

-- 最近决策视图
CREATE OR REPLACE VIEW recent_decisions AS
SELECT 
  id,
  created_at,
  symbol,
  action,
  reason,
  strategy_source,
  market_regime,
  risk_score
FROM decision_log
ORDER BY created_at DESC
LIMIT 100;

-- ============================================
-- 完成提示
-- ============================================

DO $$
BEGIN
  RAISE NOTICE '✅ 数据库 Schema 创建完成！';
  RAISE NOTICE '📊 已创建表：';
  RAISE NOTICE '   - ai_training_data_v2 (AI 训练数据)';
  RAISE NOTICE '   - system_settings (系统配置)';
  RAISE NOTICE '   - market_snapshot (实时监控快照)';
  RAISE NOTICE '   - decision_log (决策日志)';
  RAISE NOTICE '📡 Realtime 已启用';
END $$;`;

        // 设置 textarea 内容
        document.getElementById('sqlContent').value = sqlContent;

        function copyToClipboard() {
            const textarea = document.getElementById('sqlContent');
            textarea.select();
            textarea.setSelectionRange(0, 99999); // 移动端支持
            
            try {
                document.execCommand('copy');
                showStatus('✅ SQL 已复制到剪贴板！现在可以粘贴到 Supabase SQL Editor 了。', 'success');
            } catch (err) {
                // 使用现代 API
                navigator.clipboard.writeText(sqlContent).then(() => {
                    showStatus('✅ SQL 已复制到剪贴板！', 'success');
                }).catch(() => {
                    showStatus('❌ 复制失败，请手动选择并复制。', 'error');
                });
            }
        }

        function openSupabase() {
            window.open('https://supabase.com/dashboard/project/qpufonakogxhiauojbcd', '_blank');
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            setTimeout(() => {
                status.className = 'status';
            }, 5000);
        }
    </script>
</body>
</html>
