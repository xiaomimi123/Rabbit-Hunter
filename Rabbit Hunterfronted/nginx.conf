# Rabbit Hunter 前端 — nginx serve + 反代 API/WS 到后端
#
# 浏览器永远只跟 http://localhost:5173/ 说话；nginx 内部把
#   /api/...     → http://api:8000/api/...
#   /ws/v43      → ws://api:8000/ws/v43
# 这样前端 .env 里只要 VITE_API_URL=/api、VITE_WS_URL=/ws/v43 就够了。

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上游：在同一 docker network 下，'api' 是 docker-compose service 名
    # WebSocket 需要 Upgrade / Connection 头透传
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /ws/v43 {
        proxy_pass http://api:8000/ws/v43;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;       # WS 长连接需要长 timeout
        proxy_send_timeout 3600s;
    }

    location /ws/v5 {
        proxy_pass http://api:8000/ws/v5;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — 所有未匹配路径回 index.html，让 React Router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip 默认开
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;
}
